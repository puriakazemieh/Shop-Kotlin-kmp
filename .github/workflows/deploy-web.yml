name: Deploy Web (GitHub Pages)

# Builds the Compose-Web app and publishes it to GitHub Pages so you get a public
# link to open on any device. Optionally bake a WordPress API base so the hosted
# app reads from your site with no query string needed.
#
# One-time setup: repo Settings → Pages → Build and deployment → Source =
# "GitHub Actions". Then run this workflow; the link is printed at the end and
# shown on the workflow run summary.
on:
  workflow_dispatch:
    inputs:
      api_base:
        description: 'WordPress REST base to bake in (e.g. https://kazemieh.com/wp-json/carmilla/v1/). Leave empty to choose at runtime with ?api=…'
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Compose-Web
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :composeApp:jsBrowserDistribution
      - name: Prepare site
        run: |
          mkdir -p site
          cp -r composeApp/build/dist/js/productionExecutable/* site/
          API="${{ inputs.api_base }}"
          if [ -n "$API" ]; then
            # If the page is opened without ?api=, redirect once to add the baked base.
            node -e "
              const fs=require('fs');const f='site/index.html';let h=fs.readFileSync(f,'utf8');
              const s='<script>(function(){try{var u=new URL(location.href);if(!u.searchParams.get(\'api\')){u.searchParams.set(\'api\',\'$API\');location.replace(u.toString());}}catch(e){}})();</script>';
              h=h.replace('</head>', s+'</head>');fs.writeFileSync(f,h);
            "
            echo "Baked API base: $API"
          fi
          # SPA fallback so deep links don't 404 on Pages.
          cp site/index.html site/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Show link
        run: echo "### 🌐 Web app: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
