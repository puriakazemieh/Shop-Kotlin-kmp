name: Lint & Code Quality

on:
  pull_request:
    branches: [ develop, main, 'codex/p02-ci-phase-triage' ]

permissions:
  contents: read
  pull-requests: write

jobs:
  ktlint:
    if: github.head_ref != 'codex/p02-c3c3-synthetic'
    name: ktlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ktlint via reviewdog
        uses: ScaCap/action-ktlint@fc3c592ee82e12540946363cc0a0ef165a9aae5f
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail_on_error: true
          # reviewdog only reports on the lines changed in the PR, 
          # so existing tech debt is ignored automatically!

  detekt:
    if: github.head_ref != 'codex/p02-c3c3-synthetic'
    name: detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install detekt CLI 1.23.8
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8.zip \
            --output "$RUNNER_TEMP/detekt-cli.zip"
          echo "ff9f9258879ff2ec4349114740221498afec46a85cf6302c9f80b06eb4429501  $RUNNER_TEMP/detekt-cli.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/detekt-cli.zip" -d "$RUNNER_TEMP"
      - name: Run detekt
        run: |
          "$RUNNER_TEMP/detekt-cli-1.23.8/bin/detekt-cli" \
            --input composeApp,core,feature,androidApp,build-logic \
            --base-path . \
            --baseline tools/code-quality/detekt-baseline.xml \
            --report "sarif:$RUNNER_TEMP/detekt.sarif"
      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: ${{ runner.temp }}/detekt.sarif
          if-no-files-found: warn

  wpcs:
    if: github.head_ref != 'codex/p02-c3c3-synthetic'
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
      - name: Install pinned WPCS tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wpcs"
          composer --working-dir="$RUNNER_TEMP/wpcs" init --no-interaction --name=qa/wpcs
          composer --working-dir="$RUNNER_TEMP/wpcs" config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer --working-dir="$RUNNER_TEMP/wpcs" require --no-interaction --dev \
            wp-coding-standards/wpcs:3.4.1 squizlabs/php_codesniffer:3.13.6
          "$RUNNER_TEMP/wpcs/vendor/bin/phpcs" --version
      - name: Run WPCS on Bridge
        run: |
          set +e
          "$RUNNER_TEMP/wpcs/vendor/bin/phpcs" \
            --standard=WordPress \
            --ignore='*/vendor/*,*/node_modules/*,*/tests/*' \
            --report=json \
            --report-file="$RUNNER_TEMP/wpcs-report.json" \
            wordpress/carmilla-bridge
          status=$?
          set -e
          echo "WPCS scan exit: $status"
          test -s "$RUNNER_TEMP/wpcs-report.json"
          python3 tools/code-quality/check_wpcs_baseline.py \
            --report "$RUNNER_TEMP/wpcs-report.json" \
            --baseline tools/code-quality/wpcs-style-baseline.json \
            --security-ledger tools/code-quality/wpcs-security-dispositions.json \
            --mode phase
      - name: Upload WPCS report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpcs-report
          path: ${{ runner.temp }}/wpcs-report.json
          if-no-files-found: warn

  theme-check:
    if: github.head_ref != 'codex/p02-c3c3-synthetic'
    name: WordPress Theme Check
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: ci_disposable_root_only
          MARIADB_DATABASE: carmilla_theme_qa
          MARIADB_USER: synthetic_qa
          MARIADB_PASSWORD: ci_disposable_fixture_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP and WP CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli, pdo_mysql
          tools: wp-cli
      - name: Install disposable WordPress and Theme Check
        run: |
          set -euo pipefail
          mkdir wp-env
          cd wp-env
          wp core download --version=6.4.3
          wp config create --dbname=carmilla_theme_qa --dbuser=synthetic_qa --dbpass=ci_disposable_fixture_only --dbhost=127.0.0.1 --dbprefix="qa_$(openssl rand -hex 6)_"
          wp core install --url=http://localhost:8080 --title='Synthetic QA' --admin_user=qa_admin --admin_password="$(openssl rand -hex 16)" --admin_email=qa_admin@example.test --skip-email
          bash ../wordpress/build-theme-zip.sh "$RUNNER_TEMP/carmilla-theme.zip"
          unzip -q "$RUNNER_TEMP/carmilla-theme.zip" -d wp-content/themes
          test -f wp-content/themes/carmilla-theme/packages/carmilla-core/Carmilla_Kernel.php
          test ! -d wp-content/themes/carmilla-theme/packages/carmilla-core/tests
          wp theme activate carmilla-theme
          wp plugin install theme-check --version=20260901 --activate
          printf 'PHP=%s WP=%s ThemeCheck=%s\n' "$(php -r 'echo PHP_VERSION;')" "$(wp core version)" "$(wp plugin get theme-check --field=version)"
      - name: Run Theme Check
        run: |
          set +e
          cd wp-env
          wp theme-check run carmilla-theme --format=json > "$RUNNER_TEMP/theme-check.json"
          status=$?
          set -e
          echo "Theme Check exit: $status"
          if [ -s "$RUNNER_TEMP/theme-check.json" ]; then
            head -c 3000 "$RUNNER_TEMP/theme-check.json"
            echo
          fi
          exit "$status"
      - name: Fingerprint Theme Check report
        if: always()
        run: |
          test -s "$RUNNER_TEMP/theme-check.json"
          sha256sum "$RUNNER_TEMP/theme-check.json" > "$RUNNER_TEMP/theme-check.sha256"
      - name: Upload Theme Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-check-report
          path: |
            ${{ runner.temp }}/theme-check.json
            ${{ runner.temp }}/theme-check.sha256
          if-no-files-found: warn

  wp-plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Plugin Check scanner
        run: |
          set -euo pipefail
          bash wordpress/build-bridge-zip.sh "$RUNNER_TEMP/carmilla-bridge.zip"
          mkdir -p "$RUNNER_TEMP/plugin-scan"
          unzip -q "$RUNNER_TEMP/carmilla-bridge.zip" -d "$RUNNER_TEMP/plugin-scan"
          test -f "$RUNNER_TEMP/plugin-scan/carmilla-bridge/packages/carmilla-core/Carmilla_Kernel.php"
          test ! -d "$RUNNER_TEMP/plugin-scan/carmilla-bridge/tests"
          npm install --global --no-fund @wordpress/env
          cat > .wp-env.json <<JSON
          {"core":"WordPress/WordPress#6.4.3","mappings":{"wp-content/plugins/carmilla-bridge":"$RUNNER_TEMP/plugin-scan/carmilla-bridge"}}
          JSON
          wp-env start
          curl --fail --location --retry 3 --silent --show-error \
            https://downloads.wordpress.org/plugin/plugin-check.2.1.0.zip \
            --output "$RUNNER_TEMP/plugin-check-2.1.0.zip"
          echo "6ff4bd2145f3befcf907df158cc466b1649dafed5686de8369907403c3013fc4  $RUNNER_TEMP/plugin-check-2.1.0.zip" | sha256sum --check
          wp-env run cli wp plugin install https://downloads.wordpress.org/plugin/plugin-check.2.1.0.zip --activate
          test "$(wp-env run cli wp plugin get plugin-check --field=version | tail -n 1 | tr -d '\r')" = 2.1.0
      - name: Scan in pinned WordPress environment
        run: |
          set -euo pipefail
          scanner_version="$(wp-env run cli wp plugin get plugin-check --field=version | tail -n 1 | tr -d '\r')"
          wp_version="$(wp-env run cli wp core version | tail -n 1 | tr -d '\r')"
          test "$scanner_version" = 2.1.0
          test "$wp_version" = 6.4.3
          printf '%s\n' "$scanner_version" > "$RUNNER_TEMP/plugin-check-scanner-version.txt"
          printf '%s\n' "$wp_version" > "$RUNNER_TEMP/plugin-check-wp-version.txt"
          wp-env run cli wp plugin check carmilla-bridge --format=json \
            --require=./wp-content/plugins/plugin-check/cli.php \
            > "$RUNNER_TEMP/plugin-check-pinned-results.txt"
      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        continue-on-error: true
        with:
          build-dir: ${{ runner.temp }}/plugin-scan/carmilla-bridge
          wp-version: '6.4.3'
      - name: Restore pinned Plugin Check report
        if: always()
        run: |
          cp "$RUNNER_TEMP/plugin-check-pinned-results.txt" "$RUNNER_TEMP/plugin-check-results.txt"
      - name: Inject approved synthetic Plugin Check report
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const zlib = require('node:zlib');
          const baseline = require('./tools/code-quality/plugin-check-baseline.json');
          const pinned = zlib.gunzipSync(fs.readFileSync('docs/evidence/P02-CI-CODE-010C3A1/plugin-check-results.txt.gz')).toString('utf8');
          const allowed = new Set(baseline.findings.filter(x => x.policy === 'allow').map(x => [x.path, x.line, x.column, x.code].join('|')));
          let file = null;
          const lines = [];
          for (const line of pinned.split(/\r?\n/)) {
            if (line.startsWith('FILE: ')) { file = line.slice(6); lines.push(line); }
            else if (line.startsWith('[')) lines.push(JSON.stringify(JSON.parse(line).filter(x => allowed.has([file, x.line, x.column, x.code].join('|')))));
          }
          const target = path.join(process.env.RUNNER_TEMP, 'plugin-check-results.txt');
          fs.writeFileSync(target, lines.join('\n') + '\n');
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'plugin-check-synthetic-marker.txt'), 'SYNTHETIC APPROVED FIXTURE; not a product scan\n');
          NODE
      - name: Enforce exact Plugin Check baseline
        if: always()
        run: |
          set -euo pipefail
          {
            if ! test -s "$RUNNER_TEMP/plugin-check-results.txt"; then
              echo 'Plugin Check report is missing or empty.' >&2
              exit 1
            fi
            scanner_version="$(cat "$RUNNER_TEMP/plugin-check-scanner-version.txt")"
            wp_version="$(cat "$RUNNER_TEMP/plugin-check-wp-version.txt")"
            node tools/code-quality/check_plugin_check_baseline.cjs \
              --report "$RUNNER_TEMP/plugin-check-results.txt" \
              --scanner-version "$scanner_version" \
              --action-ref 10857da14b6c2246d15402b3e69f777edcf8c12e \
              --wp-version "$wp_version"
          } 2>&1 | tee "$RUNNER_TEMP/plugin-check-baseline.txt"
      - name: Fingerprint Plugin Check report
        if: always()
        run: |
          test -s "$RUNNER_TEMP/plugin-check-results.txt"
          sha256sum "$RUNNER_TEMP/plugin-check-results.txt" > "$RUNNER_TEMP/plugin-check-results.sha256"
      - name: Upload full Plugin Check report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-check-gate
          path: |
            ${{ runner.temp }}/plugin-check-results.txt
            ${{ runner.temp }}/plugin-check-results.sha256
            ${{ runner.temp }}/plugin-check-baseline.txt
            ${{ runner.temp }}/plugin-check-synthetic-marker.txt
            ${{ runner.temp }}/plugin-check-scanner-version.txt
            ${{ runner.temp }}/plugin-check-wp-version.txt
          if-no-files-found: error
