name: WordPress Integration

on:
  workflow_dispatch:
    inputs:
      negative_smoke:
        description: 'Run the synthetic failing smoke to verify the CI gate'
        type: boolean
        default: false
  push:
    branches: [develop]
    paths:
      - 'wordpress/**'
      - '.github/workflows/wordpress-integration.yml'
  pull_request:
    paths:
      - 'wordpress/**'
      - '.github/workflows/wordpress-integration.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: ci_disposable_root_only
          MARIADB_DATABASE: carmilla_ci
          MARIADB_USER: carmilla_ci
          MARIADB_PASSWORD: ci_disposable_fixture_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      CI_DB_PASSWORD: ci_disposable_fixture_only
    strategy:
      matrix:
        include:
          - php: '7.4'
            wp: latest
            woo: latest
            real_smoke: p07
          - php: '8.1'
            wp: latest
            woo: latest
            real_smoke: p07
          - php: '8.2'
            wp: latest
            woo: latest
            real_smoke: p07
          - php: '7.4'
            wp: '6.4.3'
            woo: '8.5.2'
            real_smoke: woo-reference
          - php: '8.1'
            wp: '6.4.3'
            woo: '8.5.2'
            real_smoke: woo-reference
          - php: '8.2'
            wp: '6.4.3'
            woo: '8.5.2'
            real_smoke: woo-reference
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo_mysql, json
          tools: wp-cli

      - name: Install WordPress
        run: |
          set -euo pipefail
          mkdir wp-env
          cd wp-env
          if [ "${{ matrix.wp }}" = "latest" ]; then
            wp core download
          else
            wp core download --version="${{ matrix.wp }}"
          fi
          wp config create --dbname=carmilla_ci --dbuser=carmilla_ci --dbpass="$CI_DB_PASSWORD" --dbhost=127.0.0.1 --dbprefix="qa_$(openssl rand -hex 6)_"
          wp core install --url="http://localhost:8080" --title="Synthetic QA" --admin_user=qa_admin --admin_password="$(openssl rand -hex 16)" --admin_email=qa_admin@example.test --skip-email

      - name: Copy Theme, Plugin and shared core
        run: |
          set -euo pipefail
          cp -R wordpress/carmilla-bridge wp-env/wp-content/plugins/carmilla-bridge
          cp -R wordpress/carmilla-theme wp-env/wp-content/themes/carmilla-theme
          mkdir -p wp-env/wp-content/plugins/carmilla-bridge/packages wp-env/wp-content/themes/carmilla-theme/packages
          cp -R wordpress/packages/carmilla-core wp-env/wp-content/plugins/carmilla-bridge/packages/carmilla-core
          cp -R wordpress/packages/carmilla-core wp-env/wp-content/themes/carmilla-theme/packages/carmilla-core

      - name: Install WooCommerce
        run: |
          set -euo pipefail
          cd wp-env
          if [ "${{ matrix.woo }}" = "latest" ]; then
            wp plugin install woocommerce --activate
          else
            wp plugin install woocommerce --version="${{ matrix.woo }}" --activate
          fi

      - name: Activate Carmilla Bridge and Theme
        run: |
          set -euo pipefail
          cd wp-env
          wp plugin activate carmilla-bridge
          wp theme activate carmilla-theme
          wp plugin is-active woocommerce
          wp plugin is-active carmilla-bridge
          wp theme is-active carmilla-theme
          wp eval 'if ( ! class_exists( "Carmilla_Kernel" ) ) { exit( 1 ); }'
          wp eval '$response = rest_do_request( new WP_REST_Request( "GET", "/carmilla/v1/client-manifest" ) ); if ( $response->get_status() !== 200 ) { exit( 1 ); }'
          printf 'PHP=%s WP=%s Woo=%s\n' "$(php -r 'echo PHP_VERSION;')" "$(wp core version)" "$(wp plugin get woocommerce --field=version)"

      - name: Run hermetic smokes
        run: |
          set -euo pipefail
          cd wordpress/carmilla-bridge
          for f in smoke.php smoke-legacy-migration.php smoke-manifest-security.php smoke-manifest.php smoke-messaging.php smoke-p07-seed-migration.php smoke-phase2.php smoke-phase3.php smoke-phase4.php smoke-phase5.php smoke-phase6.php smoke-phase7.php smoke-security.php smoke-web-request-policy.php; do
            echo "Running $f"
            php "tests/$f"
          done

      - name: Run disposable real WordPress smoke
        run: |
          set -euo pipefail
          cd wp-env
          case '${{ matrix.real_smoke }}' in
            p07)
              wp eval-file ../wordpress/carmilla-bridge/tests/smoke-p07-wordpress.php
              ;;
            woo-reference)
              CARMILLA_REFERENCE_DISPOSABLE=yes CARMILLA_REFERENCE_PREFIX="qa_$(openssl rand -hex 6)_" wp eval-file ../wordpress/carmilla-bridge/tests/smoke-woo-reference.php
              ;;
            *) echo 'Unknown real smoke' >&2; exit 2 ;;
          esac

      - name: Synthetic negative gate
        if: ${{ inputs.negative_smoke == true }}
        run: php -r 'exit(17);'

