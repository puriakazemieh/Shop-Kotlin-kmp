name: Build All

# Manual builds of every client output. Run from the Actions tab (Run workflow),
# tick the targets you want, then download the artifacts from the finished run.
#   - Android : one debug APK per brand flavor (carmila / atris / chronos /
#               academy / psych / wp)
#   - Desktop : a runnable uber-jar (java -jar …) for the current OS (Linux)
#   - Web     : the Compose-Web static site, zipped (also see deploy-web.yml for
#               a hosted link)
on:
  workflow_dispatch:
    inputs:
      android:
        description: 'Build Android APKs (all brand flavors)'
        type: boolean
        default: true
      desktop:
        description: 'Build Desktop uber-jar'
        type: boolean
        default: true
      web:
        description: 'Build Compose-Web (zip)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  android:
    if: ${{ inputs.android }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APKs (all flavors)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            assembleCarmilaDebug assembleAtrisDebug assembleChronosDebug \
            assembleAcademyDebug assemblePsychDebug assembleWpDebug
      - name: Collect APKs
        if: always()
        run: |
          mkdir -p out
          find composeApp/build/outputs/apk -name '*.apk' -exec cp {} out/ \; 2>/dev/null || true
          ls -la out || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apks
          path: out/*.apk
          if-no-files-found: warn

  desktop:
    if: ${{ inputs.desktop }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build desktop uber-jar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :composeApp:packageUberJarForCurrentOS
      - name: Collect jar
        if: always()
        run: |
          mkdir -p out
          find composeApp/build/compose/jars -name '*.jar' -exec cp {} out/ \; 2>/dev/null || true
          ls -la out || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-jar
          path: out/*.jar
          if-no-files-found: warn

  web:
    if: ${{ inputs.web }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Compose-Web
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :composeApp:jsBrowserDistribution
      - name: Zip web dist
        run: |
          cd composeApp/build/dist/js/productionExecutable
          zip -r "$GITHUB_WORKSPACE/carmilla-web.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: carmilla-web.zip
          if-no-files-found: warn
