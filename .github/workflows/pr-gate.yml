name: PR Gate

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop, main ]

permissions:
  contents: read

jobs:
  wordpress-integration:
    uses: ./.github/workflows/wordpress-integration.yml

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Lint
        run: ./gradlew lint --no-daemon --stacktrace

      - name: Run Unit Tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Verify Package/Assemble (Android & Desktop)
        run: ./gradlew assembleDebug :composeApp:packageUberJarForCurrentOS --no-daemon --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: warn

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results*.html'
          if-no-files-found: warn

  gate:
    name: PR Gate Result
    if: always()
    needs: [validate, wordpress-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require all critical jobs
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          WORDPRESS_RESULT: ${{ needs['wordpress-integration'].result }}
        run: |
          echo "KMP lint/unit/package: $VALIDATE_RESULT"
          echo "WordPress integration: $WORDPRESS_RESULT"
          test "$VALIDATE_RESULT" = success
          test "$WORDPRESS_RESULT" = success
