name: Release Artifacts

# Strictly dedicated to production/release artifact packaging.
# Decoupled from debug build workflows (build-all.yml, pr-gate.yml).
# Produces versioned release artifacts, SHA-256 checksums, CycloneDX/SPDX SBOMs,
# and enforces a 90-day retention policy.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Android brand flavor for release APK'
        type: choice
        default: all
        options: [all, carmila, atris, chronos, academy, psych, wp]
      build_android:
        description: 'Build Android Release APK(s)'
        type: boolean
        default: true
      build_desktop:
        description: 'Build Desktop Release UberJar'
        type: boolean
        default: true
      build_web:
        description: 'Build Web Distribution Bundle'
        type: boolean
        default: true
      build_wordpress:
        description: 'Build WordPress Release Packages (Theme + Bridge)'
        type: boolean
        default: true
      retention_days:
        description: 'Artifact retention in days (minimum 30, recommended 90)'
        type: number
        default: 90

permissions:
  contents: write

jobs:
  release:
    name: Build & Package Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js for SBOM and Release Tooling
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Output Directory
        run: |
          mkdir -p dist

      - name: Build Android Release APK(s)
        if: ${{ github.event_name == 'push' || inputs.build_android }}
        run: |
          FLAVOR="${{ inputs.flavor || 'all' }}"
          if [ "$FLAVOR" = "all" ]; then
            TASKS=":androidApp:assembleCarmilaRelease :androidApp:assembleAtrisRelease :androidApp:assembleChronosRelease :androidApp:assembleAcademyRelease :androidApp:assemblePsychRelease :androidApp:assembleWpRelease"
          else
            CAP="$(echo "${FLAVOR:0:1}" | tr '[:lower:]' '[:upper:]')${FLAVOR:1}"
            TASKS=":androidApp:assemble${CAP}Release"
          fi
          echo "Building Android release tasks: $TASKS"
          ./gradlew $TASKS --no-daemon -Pandroid.injected.lint.vital=false
          COPIED=$(find androidApp/build/outputs/apk -name '*release*.apk' -exec cp -v {} dist/ \; | wc -l)
          if [ "$COPIED" -eq 0 ]; then
            echo "Error: No release APK found to copy to dist/!" >&2
            exit 1
          fi

      - name: Build Desktop Release UberJar
        if: ${{ github.event_name == 'push' || inputs.build_desktop }}
        run: |
          ./gradlew :composeApp:packageUberJarForCurrentOS --no-daemon
          JAR_COPIED=$(find composeApp/build/compose/jars -name '*.jar' -exec cp -v {} dist/ \; | wc -l)
          if [ "$JAR_COPIED" -eq 0 ]; then
            echo "Error: No desktop release JAR found to copy to dist/!" >&2
            exit 1
          fi

      - name: Build Web Release Distribution
        if: ${{ github.event_name == 'push' || inputs.build_web }}
        run: |
          ./gradlew :composeApp:jsBrowserDistribution --no-daemon
          if [ ! -d "composeApp/build/dist/js/productionExecutable" ]; then
            echo "Error: Directory composeApp/build/dist/js/productionExecutable does not exist!" >&2
            exit 1
          fi
          cd composeApp/build/dist/js/productionExecutable && zip -rq "$GITHUB_WORKSPACE/dist/carmilla-web-release.zip" . && cd "$GITHUB_WORKSPACE"
          if [ ! -f "$GITHUB_WORKSPACE/dist/carmilla-web-release.zip" ]; then
            echo "Error: carmilla-web-release.zip was not created!" >&2
            exit 1
          fi

      - name: Package WordPress Release Zips
        if: ${{ github.event_name == 'push' || inputs.build_wordpress }}
        run: |
          theme_ver=$(grep -m1 -oiP 'Version:\s*\K[0-9.]+' wordpress/carmilla-theme/style.css || echo 1.0.0)
          plug_ver=$(grep -m1 -oiP 'Version:\s*\K[0-9.]+' wordpress/carmilla-bridge/carmilla-bridge.php || echo 1.0.0)
          THEME_ZIP="$GITHUB_WORKSPACE/dist/carmilla-theme-v${theme_ver}-release.zip"
          BRIDGE_ZIP="$GITHUB_WORKSPACE/dist/carmilla-bridge-v${plug_ver}-release.zip"
          bash wordpress/build-theme-zip.sh "$THEME_ZIP"
          bash wordpress/build-bridge-zip.sh "$BRIDGE_ZIP"
          if [ ! -f "$THEME_ZIP" ] || [ ! -f "$BRIDGE_ZIP" ]; then
            echo "Error: WordPress release zips were not created in dist/!" >&2
            exit 1
          fi

      - name: Validate Release Product Artifact Inventory
        run: |
          echo "Validating release product artifact inventory..."
          PRODUCT_COUNT=$(find dist -maxdepth 1 -type f \( -name '*.apk' -o -name '*.jar' -o -name '*.zip' \) | wc -l)
          if [ "$PRODUCT_COUNT" -eq 0 ]; then
            echo "Error: No release product artifacts (*.apk, *.jar, *.zip) found in dist/! Refusing to publish metadata-only release." >&2
            exit 1
          fi
          echo "Found $PRODUCT_COUNT product release artifact(s):"
          ls -lh dist/

      - name: Generate SBOM (CycloneDX & SPDX), Checksums & Release Metadata
        run: |
          VERSION="${GITHUB_REF_NAME:-1.0.0}"
          node tools/ci/generate_sbom.cjs --out-dir dist --version "$VERSION"
          cat dist/SHA256SUMS.txt
          cat dist/release-metadata.json

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ github.ref_name || 'latest' }}
          path: dist/*
          retention-days: ${{ inputs.retention_days || 90 }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
