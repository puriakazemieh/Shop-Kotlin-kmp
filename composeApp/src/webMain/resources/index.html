<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: wasm-unsafe-eval; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: *; connect-src 'self' http://localhost:* https://*; font-src 'self' data:;">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>kmp-shop</title>
    <base href="/">
    <link type="text/css" rel="stylesheet" href="/styles.css">
    <link rel="manifest" id="pwa-manifest" href="/manifest-wp.json">
    <link type="text/css" rel="stylesheet" href="/styles.css">
    <link rel="manifest" id="pwa-manifest" href="/manifest-wp.json">
</head>
<body style="text-align: center; align-content: center">
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
    <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
    <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
            stroke-dasharray="90 125">
        <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                          repeatCount="indefinite"/>
    </circle>
</svg>
<script>
    console.log("HTML loaded");
    window.addEventListener('error', (e) => {
        console.error('Global error:', e.error);
    });
    
    // Select correct config based on URL
    let configUrl = '/app-config-wp.json';
    if (window.location.search.includes('api=')) {
        document.getElementById('pwa-manifest').href = '/manifest-spring.json';
        configUrl = '/app-config-spring.json';
    } else {
        document.getElementById('pwa-manifest').href = '/manifest-wp.json';
    }

    fetch(configUrl)
        .then(response => response.json())
        .then(config => {
            window.appConfig = config;
            console.log("Loaded App Config:", config);
            var script = document.createElement('script');
            script.src = '/composeApp.js';
            document.body.appendChild(script);
        })
        .catch(err => console.error("Failed to load config", err));

    window.requestPushPermission = function() {
        return new Promise((resolve, reject) => {
            if (!('Notification' in window)) {
                reject('Push notifications not supported');
                return;
            }
            Notification.requestPermission().then(permission => {
                if (permission === 'granted') {
                    navigator.serviceWorker.ready.then(reg => {
                        reg.pushManager.subscribe({
                            userVisibleOnly: true,
                            applicationServerKey: 'BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckjBJuB240409Y_Z6s0Z0eX1lqZ1gY' // Dummy VAPID public key
                        }).then(sub => resolve(sub)).catch(e => reject(e));
                    });
                } else {
                    reject('Permission denied');
                }
            });
        });
    };

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            const swUrl = configUrl.includes('spring') ? '/sw-spring.js' : '/sw-wp.js';
            navigator.serviceWorker.register(swUrl).then(function(registration) {
                console.log('ServiceWorker registration successful with scope: ', registration.scope);
                
                registration.addEventListener('updatefound', () => {
                    const newWorker = registration.installing;
                    if (!newWorker) return;
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            if (confirm("نسخه جدیدی از برنامه در دسترس است. آیا می‌خواهید اکنون به‌روزرسانی کنید؟")) {
                                newWorker.postMessage({ type: 'SKIP_WAITING' });
                            }
                        }
                    });
                });
            }, function(err) {
                console.log('ServiceWorker registration failed: ', err);
            });
            
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    refreshing = true;
                    window.location.reload();
                }
            });
        });
    }
</script>
</body>
</html>
